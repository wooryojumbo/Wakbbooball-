<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wakbbooball</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f0f3f8;
      font-family: sans-serif;
      overflow: hidden;
    }

    .ball-container {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .wakbboo-ball {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      position: relative;
      box-shadow: 
        0 20px 35px rgba(0, 0, 0, 0.12),
        inset -15px -15px 30px rgba(0, 0, 0, 0.08),
        inset 15px 15px 25px rgba(255, 255, 255, 0.9);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.25);
      backdrop-filter: blur(2px);
      overflow: hidden;
    }

    .wakbboo-ball::before {
      content: '';
      position: absolute;
      top: 12%;
      left: 18%;
      width: 45px;
      height: 25px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      transform: rotate(-35deg);
      filter: blur(1px);
    }

    .type-1 {
      background: radial-gradient(circle at 35% 35%, 
        rgba(255, 182, 193, 0.95) 0%, 
        rgba(173, 216, 230, 0.9) 45%, 
        rgba(255, 255, 204, 0.85) 85%);
    }

    .type-2 {
      background: radial-gradient(circle at 35% 35%, 
        rgba(168, 230, 207, 0.95) 0%, 
        rgba(125, 207, 255, 0.9) 50%, 
        rgba(218, 187, 255, 0.85) 90%);
    }

    .type-3 {
      background: radial-gradient(circle at 35% 35%, 
        rgba(255, 209, 163, 0.95) 0%, 
        rgba(255, 154, 162, 0.9) 50%, 
        rgba(230, 230, 250, 0.85) 90%);
    }

    .wakbboo-ball.pressed {
      transform: scale(1.22, 0.68) translateY(25px);
      transition: transform 0.04s ease-out;
    }

    .selector-bar {
      margin-top: 60px;
      display: flex;
      gap: 18px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    .mini-ball {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }

    .mini-ball:active {
      transform: scale(0.9);
    }

    .mini-ball.active {
      border-color: #555;
      transform: scale(1.15);
    }
  </style>
</head>
<body>

  <div class="ball-container" id="ballContainer">
    <div class="wakbboo-ball type-1" id="mainBall"></div>
  </div>

  <div class="selector-bar">
    <div class="mini-ball type-1 active" onclick="selectType('type-1', this)"></div>
    <div class="mini-ball type-2" onclick="selectType('type-2', this)"></div>
    <div class="mini-ball type-3" onclick="selectType('type-3', this)"></div>
  </div>

  <script>
    const mainBall = document.getElementById('mainBall');
    const ballContainer = document.getElementById('ballContainer');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playWaxCrackleSound() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;

      // 1. 왁스가 바삭하게 '콰직!' 깨지는 노이즈 사운드 (화이트 노이즈 + 하이패스 필터)
      const bufferSize = audioCtx.sampleRate * 0.08; // 0.08초 동안 짧게 바삭!
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(1200, now); // 바삭한 고음역대

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.5, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);

      noise.start(now);
      noise.stop(now + 0.08);

      // 2. 내부 젤리가 뭉개지며 묵직하게 찌그러지는 쫀득한 사운드
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, now + 0.04);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.18);

      oscGain.gain.setValueAtTime(0.4, now + 0.04);
      oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);

      osc.start(now + 0.04);
      osc.stop(now + 0.18);
    }

    function handleDown(e) {
      e.preventDefault();
      mainBall.classList.add('pressed');
      playWaxCrackleSound();
    }

    function handleUp() {
      mainBall.classList.remove('pressed');
    }

    ballContainer.addEventListener('mousedown', handleDown);
    ballContainer.addEventListener('mouseup', handleUp);
    ballContainer.addEventListener('mouseleave', handleUp);

    ballContainer.addEventListener('touchstart', handleDown, { passive: false });
    ballContainer.addEventListener('touchend', handleUp);

    function selectType(typeClass, el) {
      mainBall.className = 'wakbboo-ball ' + typeClass;
      document.querySelectorAll('.mini-ball').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      playWaxCrackleSound();
    }
  </script>
</body>
</html>
