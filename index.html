<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wakbbooball</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f0f3f8;
      font-family: sans-serif;
      overflow: hidden;
    }

    .ball-container {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .wakbboo-ball {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      position: relative;
      box-shadow: 
        0 20px 35px rgba(0, 0, 0, 0.12),
        inset -15px -15px 30px rgba(0, 0, 0, 0.08),
        inset 15px 15px 25px rgba(255, 255, 255, 0.9);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.25);
      backdrop-filter: blur(2px);
      overflow: hidden;
    }

    .wakbboo-ball::before {
      content: '';
      position: absolute;
      top: 12%;
      left: 18%;
      width: 45px;
      height: 25px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      transform: rotate(-35deg);
      filter: blur(1px);
    }

    .type-1 {
      background: radial-gradient(circle at 35% 35%, 
        rgba(255, 182, 193, 0.95) 0%, 
        rgba(173, 216, 230, 0.9) 45%, 
        rgba(255, 255, 204, 0.85) 85%);
    }

    .type-2 {
      background: radial-gradient(circle at 35% 35%, 
        rgba(168, 230, 207, 0.95) 0%, 
        rgba(125, 207, 255, 0.9) 50%, 
        rgba(218, 187, 255, 0.85) 90%);
    }

    .type-3 {
      background: radial-gradient(circle at 35% 35%, 
        rgba(255, 209, 163, 0.95) 0%, 
        rgba(255, 154, 162, 0.9) 50%, 
        rgba(230, 230, 250, 0.85) 90%);
    }

    .wakbboo-ball.pressed {
      transform: scale(1.22, 0.68) translateY(25px);
      transition: transform 0.04s ease-out;
    }

    .selector-bar {
      margin-top: 60px;
      display: flex;
      gap: 18px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    .mini-ball {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }
